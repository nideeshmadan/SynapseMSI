[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "synapse-msi"
version = "0.1.0"
description = "SynapseMSI External Reconstruction reference implementation and specifications"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }

authors = [
  { name = "SynapseMSI contributors" }
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0",
  "pyarrow>=14.0",
]

[tool.setuptools.packages.find]
include = ["synapse_msi*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
